<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />
    <title>Žodžių tiltai</title>
    <script>
      // Apply the saved theme before first paint so light-mode players see no dark flash.
      try {
        const saved = JSON.parse(localStorage.getItem('zt:v1:settings') || '{}');
        if (saved.darkMode === false) document.documentElement.dataset.theme = 'light';
      } catch {
        // No storage: keep the dark default.
      }
    </script>
  </head>
  <body>
    <main id="app">
      <h1 class="title">Žodžių tiltai</h1>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
